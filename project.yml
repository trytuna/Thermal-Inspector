# XcodeGen project definition.
# Generate the Xcode project with:  xcodegen generate
#
# One code base, two apps:
#   Thermal Inspector      – macOS, talks to the camera over USB (IOUSBHost)
#   Thermal Inspector iOS  – iPhone/iPad, talks to the camera as an MFi accessory (External Accessory)
# Platform-specific code lives in ThermalInspector/Platform/macOS and …/iOS.
name: Thermal Inspector

options:
  bundleIdPrefix: local.thermalinspector
  deploymentTarget:
    macOS: "15.0"
    iOS: "18.0"
  createIntermediateGroups: true
  # English is the source language; translations live in Resources/Localizable.xcstrings.
  developmentLanguage: en

settings:
  base:
    SWIFT_VERSION: "6.0"
    MARKETING_VERSION: "0.2.0"
    CURRENT_PROJECT_VERSION: "2"
    DEVELOPMENT_TEAM: ""
    # The per-pixel image processing is ~3x too slow for 25 fps without
    # optimization, so Debug builds are optimized as well.
    SWIFT_OPTIMIZATION_LEVEL: "-O"
    SWIFT_EMIT_LOC_STRINGS: YES
    LOCALIZATION_PREFERS_STRING_CATALOGS: YES

targets:
  Thermal Inspector:
    type: application
    platform: macOS
    sources:
      - path: ThermalInspector
        excludes: ["Platform/iOS/**"]
    settings:
      base:
        PRODUCT_NAME: Thermal Inspector
        PRODUCT_BUNDLE_IDENTIFIER: local.thermalinspector.app
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Thermal Inspector
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.developer-tools
        INFOPLIST_KEY_NSHumanReadableCopyright: ""
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        # Ad-hoc signing – no Apple developer account or certificate needed.
        CODE_SIGN_IDENTITY: "-"
        CODE_SIGN_STYLE: Manual
        CODE_SIGN_ENTITLEMENTS: ThermalInspector/Platform/macOS/ThermalInspector.entitlements
        # The app talks to the camera directly over USB (IOUSBHost). It is not
        # sandboxed so it can open the device and write to ~/Pictures freely.
        ENABLE_APP_SANDBOX: NO
        ENABLE_HARDENED_RUNTIME: NO
    dependencies:
      - sdk: IOUSBHost.framework

  Thermal Inspector iOS:
    type: application
    platform: iOS
    sources:
      - path: ThermalInspector
        excludes: ["Platform/macOS/**"]
    settings:
      base:
        PRODUCT_NAME: Thermal Inspector
        # Bundle IDs must be unique at Apple. Appending the team ID makes it unique
        # for everyone who builds the app with their own (free) Apple account.
        PRODUCT_BUNDLE_IDENTIFIER: local.thermalinspector.ios.$(DEVELOPMENT_TEAM:default=local)
        TARGETED_DEVICE_FAMILY: "1,2"
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_FILE: ThermalInspector/Platform/iOS/Info.plist
        INFOPLIST_KEY_CFBundleDisplayName: Thermal Inspector
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPad: UIInterfaceOrientationPortrait UIInterfaceOrientationPortraitUpsideDown UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight
        # Snapshots are saved to the app's Documents folder, visible in the Files app.
        INFOPLIST_KEY_UIFileSharingEnabled: YES
        INFOPLIST_KEY_LSSupportsOpeningDocumentsInPlace: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon-iOS
        # No team is stored in the project: everyone signs with their own Apple
        # account by choosing a team in Xcode under Signing & Capabilities.
        CODE_SIGN_STYLE: Automatic
    dependencies:
      - sdk: ExternalAccessory.framework

  Thermal Inspector Tests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: ThermalInspectorTests
    dependencies:
      - target: Thermal Inspector
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/Thermal Inspector.app/Contents/MacOS/Thermal Inspector"
        BUNDLE_LOADER: "$(TEST_HOST)"

schemes:
  Thermal Inspector:
    build:
      targets:
        Thermal Inspector: all
        Thermal Inspector Tests: [test]
    test:
      targets:
        - Thermal Inspector Tests
  Thermal Inspector iOS:
    build:
      targets:
        Thermal Inspector iOS: all
